[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-multidocs"
version = "0.1.0"
description = "Combine several independent dbt projects into one self-contained lineage page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["dbt", "lineage", "documentation", "data-engineering", "dbt-mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/raghuramsirigiri/dbt-docs-repo"
Documentation = "https://github.com/raghuramsirigiri/dbt-docs-repo/tree/main/docs"
Issues = "https://github.com/raghuramsirigiri/dbt-docs-repo/issues"
Changelog = "https://github.com/raghuramsirigiri/dbt-docs-repo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dbt-multidocs = "dbt_multidocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbt_multidocs = ["templates/*.html"]
