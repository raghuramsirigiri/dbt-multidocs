[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-multidocs"
dynamic = ["version"]
description = "Merge multiple dbt projects into one self-contained cross-project data lineage page - no warehouse connection, no dependencies."
readme = "README.md"
authors = [{ name = "Raghuram Sirigiri" }]
maintainers = [{ name = "Raghuram Sirigiri" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "dbt", "dbt-core", "dbt-docs", "dbt-mesh", "data-lineage", "lineage",
    "cross-project-lineage", "data-catalog", "analytics-engineering",
    "data-engineering", "documentation", "manifest", "elt", "data-governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://raghuramsirigiri.github.io/dbt-multidocs/"
Documentation = "https://raghuramsirigiri.github.io/dbt-multidocs/"
Demo = "https://raghuramsirigiri.github.io/dbt-multidocs/lineage.html"
Source = "https://github.com/raghuramsirigiri/dbt-multidocs"
Issues = "https://github.com/raghuramsirigiri/dbt-multidocs/issues"
Changelog = "https://github.com/raghuramsirigiri/dbt-multidocs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
# kept out of `dev` so the test matrix (down to 3.9) need not resolve them
lint = ["ruff>=0.6", "mypy>=1.8"]

[project.scripts]
dbt-multidocs = "dbt_multidocs.cli:main"

[tool.setuptools.dynamic]
# the CLI reports it too, so it may only be spelled once
version = { attr = "dbt_multidocs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbt_multidocs = ["templates/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dbt_multidocs"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["src/dbt_multidocs/templates"]

[tool.ruff.lint]
# bugs and imports, not restyling: the codebase targets 3.9 and spells its
# annotations accordingly, so the pyupgrade rules would be churn, not fixes
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
# tests import the package first, then their local conftest helpers
known-local-folder = ["conftest"]

[tool.mypy]
files = ["src/dbt_multidocs"]
