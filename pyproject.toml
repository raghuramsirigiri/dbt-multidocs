[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-multidocs"
version = "0.1.0"
description = "Combine several independent dbt projects into one self-contained lineage page."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dbt-multidocs = "dbt_multidocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbt_multidocs = ["templates/*.html"]
