name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the tool makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A flag, a config key, a different default - whatever shape it takes.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: Manual `links:` entries, a post-processing script, nothing yet.
