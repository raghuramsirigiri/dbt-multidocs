name: Release

# Tagging is the whole release. `git tag v0.1.4 && git push --tags` builds the
# artifacts, checks them, publishes to PyPI and opens the GitHub release.
on:
  push:
    tags: ["v*"]
  # a manual run builds and checks but never publishes: the publishing jobs
  # only run for a tag ref
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/dbt_multidocs/__init__.py").read_text()).group(1))')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match __version__ $pkg"
            exit 1
          }

      - name: The changelog must have an entry for it
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      - run: python -m pip install --upgrade pip build && python -m build

      - name: The wheel must carry its data files
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'dbt_multidocs/templates/lineage.html'
          python -m zipfile -l dist/*.whl | grep -q 'dbt_multidocs/py.typed'

      - name: The built wheel must install and run on its own
        # catches anything that works from the source tree but was never packaged
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/dbt-multidocs --version
          /tmp/fresh/bin/dbt-multidocs --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Take the notes from the changelog
        run: |
          python - "${GITHUB_REF_NAME#v}" > notes.md <<'EOF'
          import pathlib, sys

          version = sys.argv[1]
          section, keeping = [], False
          for line in pathlib.Path("CHANGELOG.md").read_text(encoding="utf8").splitlines():
              if line.startswith("## ["):
                  if keeping:
                      break
                  keeping = line.startswith("## [{}]".format(version))
                  continue
              if keeping:
                  section.append(line)
          print("\n".join(section).strip())
          EOF

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
