name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # path handling is the thing most likely to break per-platform
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the CLI
        shell: bash
        run: |
          dbt-multidocs --help
          dbt-multidocs discover --search-root . || true

  test-with-pyyaml:
    # The jobs above install no PyYAML, so they read YAML with the bundled
    # fallback parser. dbt-core depends on PyYAML, so a real user's environment
    # almost always takes the other branch - which needs covering too.
    name: pytest (py3.11, ubuntu-latest, PyYAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pyyaml
      - run: python -m pytest -q

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build && python -m build
      - name: The HTML template and the typing marker must be inside the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'dbt_multidocs/templates/lineage.html'
          python -m zipfile -l dist/*.whl | grep -q 'dbt_multidocs/py.typed'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
